
plugins {
    id 'java'
}

group = 'game.forgottentemples'
version = '1.0.0'

repositories {
    mavenCentral()
}

configurations {
    j2meApi
    proguard
}

dependencies {
    j2meApi 'org.microemu:cldcapi11:2.0.4'
    j2meApi 'org.microemu:midpapi20:2.0.4'

    proguard 'com.guardsquare:proguard-base:7.8.2'
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['res']
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.named('compileJava') {
    classpath = configurations.j2meApi
    options.encoding = 'UTF-8'
}

tasks.named('jar') {
    archiveFileName = 'ForgottenTemples-compiled.jar'

    manifest {
        attributes(
            'Manifest-Version': '1.0',
            'MIDlet-Name': 'Forgotten Temples',
            'MIDlet-Version': '1.0.0',
            'MIDlet-Vendor': 'Forgotten Temples Team',
            'MIDlet-1': 'Forgotten Temples,,ForgottenTemples',
            'MicroEdition-Configuration': 'CLDC-1.1',
            'MicroEdition-Profile': 'MIDP-2.0'
        )
    }
}

tasks.register('prepareDist') {
    doLast {
        file('dist').mkdirs()
    }
}

tasks.register('preverifyMidlet', JavaExec) {
    dependsOn tasks.named('jar'), tasks.named('prepareDist')

    classpath = configurations.proguard
    mainClass = 'proguard.ProGuard'

    doFirst {
        def apiFiles = configurations.j2meApi.files

        def argsList = [
            '-injars',
            tasks.named('jar').get().archiveFile.get().asFile.absolutePath,
            '-outjars',
            file('dist/ForgottenTemples.jar').absolutePath,
            '-dontshrink',
            '-dontoptimize',
            '-dontobfuscate',
            '-microedition',
            '-target',
            '1.3',
            '-keep',
            'public class ForgottenTemples { public <init>(); public void startApp(); public void pauseApp(); public void destroyApp(boolean); }'
        ]

        apiFiles.each { api ->
            argsList.add('-libraryjars')
            argsList.add(api.absolutePath)
        }

        args = argsList
    }
}

tasks.register('generateJad') {
    dependsOn tasks.named('preverifyMidlet')

    doLast {
        def jarFile = file('dist/ForgottenTemples.jar')

        if (!jarFile.exists()) {
            throw new GradleException('Preverified JAR was not created.')
        }

        def jadFile = file('dist/ForgottenTemples.jad')

        jadFile.text =
            'MIDlet-Name: Forgotten Temples\n' +
            'MIDlet-Version: 1.0.0\n' +
            'MIDlet-Vendor: Forgotten Temples Team\n' +
            'MIDlet-Jar-URL: ForgottenTemples.jar\n' +
            'MIDlet-Jar-Size: ' + jarFile.length() + '\n' +
            'MIDlet-1: Forgotten Temples,,ForgottenTemples\n' +
            'MicroEdition-Configuration: CLDC-1.1\n' +
            'MicroEdition-Profile: MIDP-2.0\n'

        println 'Created ' + jarFile
        println 'Created ' + jadFile
    }
}

tasks.register('buildMidlet') {
    dependsOn tasks.named('generateJad')
}

tasks.named('build') {
    dependsOn tasks.named('buildMidlet')
}
