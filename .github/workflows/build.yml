
name: Build Forgotten Temples Java ME

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Forgotten Temples JAR and JAD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ant zip unzip

      - name: Check project files
        run: |
          test -f build.xml
          test -f manifest.mf
          test -d src

      - name: Build Java ME game
        run: ant clean jar

      - name: Verify game files
        run: |
          test -f dist/ForgottenTemples.jar
          test -f dist/ForgottenTemples.jad
          echo "Forgotten Temples build files found."

      - name: Upload Java ME game
        uses: actions/upload-artifact@v4
        with:
          name: FORGOTTEN-TEMPLES-JAVA-ME
          path: |
            dist/ForgottenTemples.jar
            dist/ForgottenTemples.jad
          if-no-files-found: error
          retention-days: 14
