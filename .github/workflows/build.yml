
name: Build Forgotten Temples Java ME

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Forgotten Temples JAR and JAD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check project files
        run: |
          test -f build.gradle
          test -f settings.gradle
          test -f gradle.properties
          test -f src/ForgottenTemples.java
          test -f res/temple_logo.png

      - name: Build Java ME game
        run: gradle --no-daemon clean buildMidlet

      - name: Verify game files
        run: |
          test -f dist/ForgottenTemples.jar
          test -f dist/ForgottenTemples.jad
          unzip -l dist/ForgottenTemples.jar
          echo "Forgotten Temples JAR and JAD were generated."

      - name: Upload Java ME game
        uses: actions/upload-artifact@v4
        with:
          name: FORGOTTEN-TEMPLES-JAVA-ME
          path: |
            dist/ForgottenTemples.jar
            dist/ForgottenTemples.jad
          if-no-files-found: error
          retention-days: 14
